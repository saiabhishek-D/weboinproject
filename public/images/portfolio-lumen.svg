<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="lumen-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#EFF6F2"/>
      <stop offset="100%" stop-color="#DEEBE3"/>
    </radialGradient>
    <filter id="product-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#141414" flood-opacity="0.12"/>
    </filter>
  </defs>

  {/* Background */}
  <rect width="1200" height="750" fill="url(#lumen-bg)"/>

  {/* Clean Minimal Packaging Showcase */}
  {/* Box Packaging 1 (Center Left) */}
  <g transform="translate(240, 120)" filter="url(#product-shadow)">
    <rect width="320" height="480" rx="16" fill="#FFFFFF" stroke="#D1E2D7" stroke-width="1"/>
    {/* Monogram Seal */}
    <circle cx="160" cy="90" r="32" fill="#2E7D32" opacity="0.08"/>
    <text x="160" y="98" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="24" fill="#2E7D32">L</text>

    {/* Brand Title */}
    <text x="160" y="160" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="26" fill="#141414" letter-spacing="4">LUMEN</text>
    <text x="160" y="180" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="10" fill="#2E7D32" letter-spacing="3">CELLULAR LONGEVITY</text>

    <line x1="60" y1="210" x2="260" y2="210" stroke="#EAEAE6" stroke-width="1"/>

    {/* Product specs */}
    <text x="60" y="250" font-family="system-ui" font-weight="600" font-size="12" fill="#141414">Formula NMN-04</text>
    <text x="60" y="270" font-family="system-ui" font-weight="400" font-size="10" fill="#8C8C8C">60 Vegan Capsules &bull; Clinical Grade</text>
    <text x="60" y="295" font-family="system-ui" font-weight="400" font-size="10" fill="#8C8C8C">Optimized for mitochondrial ATP synthesis and DNA repair.</text>

    {/* Certified Organic Badge */}
    <rect x="60" y="380" width="200" height="34" rx="17" fill="#F0F7F2" stroke="#2E7D32" stroke-opacity="0.3" stroke-width="1"/>
    <text x="160" y="401" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="10" fill="#2E7D32">&bull; GMP CERTIFIED &bull; SWISS FORMULATED</text>
  </g>

  {/* Frosted Dropper Bottle Mockup (Right) */}
  <g transform="translate(640, 160)" filter="url(#product-shadow)">
    {/* Bottle Body */}
    <rect width="260" height="420" rx="30" fill="#FFFFFF" stroke="#D1E2D7" stroke-width="1"/>
    {/* Dropper Cap */}
    <rect x="80" y="-50" width="100" height="60" rx="8" fill="#141414"/>
    <rect x="110" y="-90" width="40" height="46" rx="12" fill="#3B5BDB"/>

    {/* Bottle Label */}
    <rect x="25" y="100" width="210" height="240" rx="12" fill="#FAFCFA" stroke="#D1E2D7" stroke-width="1"/>
    <text x="130" y="150" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="20" fill="#141414" letter-spacing="3">LUMEN</text>
    <text x="130" y="170" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="9" fill="#2E7D32" letter-spacing="2">ACTIVE SERUM</text>
    <line x1="50" y1="190" x2="210" y2="190" stroke="#EAEAE6" stroke-width="1"/>
    <text x="130" y="220" text-anchor="middle" font-family="system-ui" font-weight="500" font-size="11" fill="#141414">30 ml / 1.0 fl oz</text>
    <text x="130" y="240" text-anchor="middle" font-family="system-ui" font-weight="400" font-size="9" fill="#8C8C8C">Dermatologically Tested</text>
    <circle cx="130" cy="285" r="14" fill="#2E7D32" opacity="0.15"/>
    <text x="130" y="290" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="12" fill="#2E7D32">&plus;</text>
  </g>

  {/* Category Note */}
  <text x="100" y="680" font-family="system-ui" font-weight="600" font-size="12" fill="#8C8C8C" letter-spacing="2">BIOTECH &bull; LUXURY HEALTHCARE &bull; PACKAGING IDENTITY</text>
</svg>
