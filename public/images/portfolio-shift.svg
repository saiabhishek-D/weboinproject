<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="shift-glow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#151C35"/>
      <stop offset="100%" stop-color="#0A0C14"/>
    </radialGradient>
    <filter id="dashboard-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  {/* Background */}
  <rect width="1200" height="750" fill="url(#shift-glow)"/>

  {/* Dashboard Container (SaaS UI) */}
  <g transform="translate(100, 60)" filter="url(#dashboard-shadow)">
    {/* Outer Frame */}
    <rect width="1000" height="620" rx="16" fill="#141620" stroke="#282C40" stroke-width="1.5"/>

    {/* Top App Bar */}
    <rect width="1000" height="56" rx="16" fill="#181B26"/>
    {/* Window Controls */}
    <circle cx="28" cy="28" r="5" fill="#FF5F56"/>
    <circle cx="46" cy="28" r="5" fill="#FFBD2E"/>
    <circle cx="64" cy="28" r="5" fill="#27C93F"/>

    {/* Workspace Badge */}
    <text x="110" y="33" font-family="'Syne', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">SHIFT // ENTERPRISE</text>
    <rect x="290" y="16" width="320" height="26" rx="13" fill="#10121A"/>
    <text x="310" y="33" font-family="system-ui" font-size="11" fill="#8C8C8C">Search metrics, cohorts, or clusters... (&cmd;K)</text>

    {/* Right controls */}
    <rect x="880" y="14" width="90" height="28" rx="14" fill="#3B5BDB"/>
    <text x="925" y="32" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="11" fill="#FFF">&plus; New Query</text>

    {/* Sidebar (Left) */}
    <g transform="translate(0, 56)">
      <rect width="200" height="564" fill="#12141D" stroke="#202434" stroke-width="0.5"/>
      <text x="24" y="36" font-family="system-ui" font-weight="600" font-size="10" fill="#8C8C8C" letter-spacing="1">OVERVIEW</text>
      <rect x="16" y="50" width="168" height="34" rx="8" fill="#3B5BDB" opacity="0.15"/>
      <text x="44" y="72" font-family="system-ui" font-weight="600" font-size="12" fill="#748FFC">Live Analytics</text>
      <text x="44" y="112" font-family="system-ui" font-weight="500" font-size="12" fill="#8C8C8C">User Funnels</text>
      <text x="44" y="148" font-family="system-ui" font-weight="500" font-size="12" fill="#8C8C8C">Retention Matrix</text>
      <text x="44" y="184" font-family="system-ui" font-weight="500" font-size="12" fill="#8C8C8C">AI Forecasts</text>
      <text x="44" y="220" font-family="system-ui" font-weight="500" font-size="12" fill="#8C8C8C">Integrations</text>
    </g>

    {/* Main Content Area */}
    <g transform="translate(224, 76)">
      {/* 3 Metrics Cards */}
      {/* Metric 1 */}
      <rect width="236" height="96" rx="12" fill="#1A1D2B" stroke="#282D42" stroke-width="1"/>
      <text x="20" y="30" font-family="system-ui" font-weight="500" font-size="11" fill="#8C8C8C">MONTHLY RECURRING REVENUE</text>
      <text x="20" y="65" font-family="'Syne', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">$412,890</text>
      <text x="20" y="84" font-family="system-ui" font-weight="600" font-size="10" fill="#27C93F">&uarr; +24.6% vs last month</text>

      {/* Metric 2 */}
      <g transform="translate(256, 0)">
        <rect width="236" height="96" rx="12" fill="#1A1D2B" stroke="#282D42" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui" font-weight="500" font-size="11" fill="#8C8C8C">ACTIVE PIPELINES</text>
        <text x="20" y="65" font-family="'Syne', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">1,842</text>
        <text x="20" y="84" font-family="system-ui" font-weight="600" font-size="10" fill="#748FFC">99.99% system uptime</text>
      </g>

      {/* Metric 3 */}
      <g transform="translate(512, 0)">
        <rect width="236" height="96" rx="12" fill="#1A1D2B" stroke="#282D42" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui" font-weight="500" font-size="11" fill="#8C8C8C">MEDIAN LATENCY</text>
        <text x="20" y="65" font-family="'Syne', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">18.4 ms</text>
        <text x="20" y="84" font-family="system-ui" font-weight="600" font-size="10" fill="#27C93F">&darr; -14% optimization</text>
      </g>

      {/* Chart Section */}
      <g transform="translate(0, 116)">
        <rect width="748" height="260" rx="12" fill="#1A1D2B" stroke="#282D42" stroke-width="1"/>
        <text x="24" y="34" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Throughput Velocity &bull; 90-Day Telemetry</text>

        {/* Grid lines */}
        <line x1="24" y1="80" x2="720" y2="80" stroke="#24283B" stroke-width="1"/>
        <line x1="24" y1="130" x2="720" y2="130" stroke="#24283B" stroke-width="1"/>
        <line x1="24" y1="180" x2="720" y2="180" stroke="#24283B" stroke-width="1"/>
        <line x1="24" y1="230" x2="720" y2="230" stroke="#24283B" stroke-width="1"/>

        {/* Dynamic Curved Area Chart */}
        <path d="M 40 210 Q 140 180 240 160 T 440 120 T 580 80 T 700 65 L 700 230 L 40 230 Z" fill="#3B5BDB" opacity="0.15"/>
        <path d="M 40 210 Q 140 180 240 160 T 440 120 T 580 80 T 700 65" fill="none" stroke="#748FFC" stroke-width="3"/>
        <circle cx="700" cy="65" r="5" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="3"/>
      </g>

      {/* Mini Data Rows */}
      <g transform="translate(0, 396)">
        <rect width="748" height="110" rx="12" fill="#1A1D2B" stroke="#282D42" stroke-width="1"/>
        <text x="24" y="30" font-family="'Syne', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Real-time Anomaly Detection Queue</text>
        <rect x="24" y="46" width="700" height="24" rx="6" fill="#12141F"/>
        <circle cx="40" cy="58" r="4" fill="#27C93F"/>
        <text x="54" y="62" font-family="system-ui" font-size="10" fill="#FFF">cluster-us-east-1a: Latency normalized after auto-scaling hook</text>
        <text x="690" y="62" text-anchor="end" font-family="system-ui" font-size="10" fill="#8C8C8C">2m ago</text>

        <rect x="24" y="76" width="700" height="24" rx="6" fill="#12141F"/>
        <circle cx="40" cy="88" r="4" fill="#748FFC"/>
        <text x="54" y="92" font-family="system-ui" font-size="10" fill="#FFF">pipeline-sync-eu: Completed batch reconciliation without drift</text>
        <text x="690" y="92" text-anchor="end" font-family="system-ui" font-size="10" fill="#8C8C8C">6m ago</text>
      </g>
    </g>
  </g>
</svg>
