<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5BDB"/>
      <stop offset="100%" stop-color="#0D1A5C"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C7CFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B5BDB" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#748FFC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D1A5C" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Soft blurred shapes -->
  <circle cx="300" cy="350" r="250" fill="#5C7CFA" opacity="0.15" filter="url(#blur2)"/>
  <circle cx="900" cy="500" r="300" fill="#748FFC" opacity="0.12" filter="url(#blur2)"/>
  <circle cx="600" cy="200" r="200" fill="#91A7FF" opacity="0.1" filter="url(#blur1)"/>

  <!-- Geometric shapes -->
  <rect x="150" y="200" width="280" height="280" rx="24" fill="url(#g1)" transform="rotate(-12 290 340)"/>
  <rect x="700" y="350" width="320" height="220" rx="20" fill="url(#g2)" transform="rotate(8 860 460)"/>
  <circle cx="500" cy="450" r="120" fill="none" stroke="#748FFC" stroke-width="1.5" opacity="0.4"/>
  <circle cx="500" cy="450" r="80" fill="#5C7CFA" opacity="0.08"/>

  <!-- Lines -->
  <line x1="100" y1="600" x2="500" y2="300" stroke="#91A7FF" stroke-width="1" opacity="0.2"/>
  <line x1="700" y1="200" x2="1100" y2="700" stroke="#91A7FF" stroke-width="1" opacity="0.15"/>

  <!-- Small accent dots -->
  <circle cx="350" cy="180" r="6" fill="#748FFC" opacity="0.6"/>
  <circle cx="820" cy="280" r="4" fill="#91A7FF" opacity="0.5"/>
  <circle cx="650" cy="650" r="8" fill="#5C7CFA" opacity="0.4"/>
  <circle cx="1000" cy="350" r="5" fill="#748FFC" opacity="0.5"/>

  <!-- Glass card element -->
  <rect x="420" y="320" width="360" height="240" rx="16" fill="white" opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="450" y="360" width="120" height="8" rx="4" fill="white" opacity="0.15"/>
  <rect x="450" y="385" width="200" height="6" rx="3" fill="white" opacity="0.08"/>
  <rect x="450" y="405" width="160" height="6" rx="3" fill="white" opacity="0.08"/>
  <rect x="450" y="460" width="80" height="32" rx="16" fill="#3B5BDB" opacity="0.4" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
</svg>

