<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="kova-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#EAEAE6"/>
      <stop offset="100%" stop-color="#DCDCD7"/>
    </radialGradient>
    <filter id="phone-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#141414" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="kova-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5BDB"/>
      <stop offset="100%" stop-color="#223ca8"/>
    </linearGradient>
  </defs>

  {/* Background */}
  <rect width="1200" height="750" fill="url(#kova-bg)"/>

  {/* Subtle decorative circles */}
  <circle cx="240" cy="200" r="180" fill="#3B5BDB" opacity="0.04"/>
  <circle cx="980" cy="560" r="240" fill="#3B5BDB" opacity="0.04"/>

  {/* Floating Feature Card Left */}
  <g transform="translate(140, 220)" filter="url(#phone-shadow)">
    <rect width="260" height="150" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <circle cx="44" cy="44" r="18" fill="#3B5BDB" opacity="0.12"/>
    <text x="44" y="50" text-anchor="middle" font-family="system-ui" font-size="16" fill="#3B5BDB">&uarr;</text>
    <text x="76" y="42" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#141414">Smart Stash</text>
    <text x="76" y="58" font-family="system-ui" font-weight="500" font-size="11" fill="#8C8C8C">+18.4% APY Yield</text>
    <text x="36" y="105" font-family="'Syne', sans-serif" font-weight="800" font-size="24" fill="#141414">$24,850.00</text>
    <rect x="36" y="122" width="180" height="6" rx="3" fill="#3B5BDB" opacity="0.2"/>
    <rect x="36" y="122" width="130" height="6" rx="3" fill="#3B5BDB"/>
  </g>

  {/* Central iPhone Mockup */}
  <g transform="translate(450, 40)" filter="url(#phone-shadow)">
    {/* Phone Frame */}
    <rect width="300" height="630" rx="42" fill="#141414"/>
    <rect x="3" y="3" width="294" height="624" rx="39" fill="none" stroke="#333333" stroke-width="2"/>
    {/* Glass Screen */}
    <rect x="12" y="12" width="276" height="606" rx="32" fill="#FBFBFA"/>

    {/* Dynamic Island / Notch */}
    <rect x="105" y="22" width="90" height="24" rx="12" fill="#141414"/>
    <circle cx="175" cy="34" r="4" fill="#222"/>

    {/* App Header */}
    <circle cx="40" cy="74" r="16" fill="#141414"/>
    <text x="40" y="80" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="12" fill="#FFFFFF">K</text>
    <text x="68" y="74" font-family="'Syne', sans-serif" font-weight="800" font-size="14" fill="#141414">KOVA</text>
    <text x="68" y="87" font-family="system-ui" font-weight="500" font-size="9" fill="#8C8C8C">PRO ACCOUNT</text>
    <circle cx="260" cy="74" r="14" fill="#EAEAE6"/>

    {/* Balance Card */}
    <g transform="translate(26, 110)">
      <rect width="248" height="140" rx="20" fill="url(#kova-accent)"/>
      <text x="24" y="36" font-family="system-ui" font-weight="500" font-size="11" fill="#FFFFFF" opacity="0.8">Total Balance</text>
      <text x="24" y="74" font-family="'Syne', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">$84,320.50</text>
      <rect x="24" y="94" width="70" height="26" rx="13" fill="#FFFFFF" opacity="0.2"/>
      <text x="59" y="111" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="10" fill="#FFFFFF">+ 12.8%</text>
      <circle cx="210" cy="70" r="32" fill="#FFFFFF" opacity="0.1"/>
    </g>

    {/* Action Row */}
    <g transform="translate(26, 270)">
      <rect x="0" y="0" width="76" height="54" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="38" y="26" text-anchor="middle" font-family="system-ui" font-size="14" fill="#3B5BDB">&uarr;</text>
      <text x="38" y="42" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="9" fill="#141414">Send</text>

      <rect x="86" y="0" width="76" height="54" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="124" y="26" text-anchor="middle" font-family="system-ui" font-size="14" fill="#3B5BDB">&darr;</text>
      <text x="124" y="42" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="9" fill="#141414">Request</text>

      <rect x="172" y="0" width="76" height="54" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="210" y="26" text-anchor="middle" font-family="system-ui" font-size="14" fill="#3B5BDB">&plus;</text>
      <text x="210" y="42" text-anchor="middle" font-family="system-ui" font-weight="600" font-size="9" fill="#141414">Top Up</text>
    </g>

    {/* Recent Transactions List */}
    <g transform="translate(26, 345)">
      <text x="0" y="0" font-family="'Syne', sans-serif" font-weight="700" font-size="12" fill="#141414">Recent Transactions</text>

      {/* Item 1 */}
      <rect x="0" y="14" width="248" height="52" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <circle cx="28" cy="40" r="14" fill="#141414"/>
      <text x="28" y="45" text-anchor="middle" font-family="system-ui" font-size="10" fill="#FFF">N</text>
      <text x="52" y="36" font-family="system-ui" font-weight="600" font-size="11" fill="#141414">Netflix Europe</text>
      <text x="52" y="48" font-family="system-ui" font-size="9" fill="#8C8C8C">Subscription</text>
      <text x="234" y="42" text-anchor="end" font-family="'Syne', sans-serif" font-weight="700" font-size="11" fill="#141414">-$19.99</text>

      {/* Item 2 */}
      <rect x="0" y="74" width="248" height="52" rx="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
      <circle cx="28" cy="100" r="14" fill="#3B5BDB"/>
      <text x="28" y="105" text-anchor="middle" font-family="system-ui" font-size="10" fill="#FFF">F</text>
      <text x="52" y="96" font-family="system-ui" font-weight="600" font-size="11" fill="#141414">Forma Payout</text>
      <text x="52" y="108" font-family="system-ui" font-size="9" fill="#8C8C8C">Direct Deposit</text>
      <text x="234" y="102" text-anchor="end" font-family="'Syne', sans-serif" font-weight="700" font-size="11" fill="#3B5BDB">+$4,200.00</text>
    </g>

    {/* Home Indicator */}
    <rect x="95" y="600" width="110" height="4" rx="2" fill="#141414"/>
  </g>

  {/* Floating Feature Card Right */}
  <g transform="translate(800, 360)" filter="url(#phone-shadow)">
    <rect width="250" height="130" rx="16" fill="#141414"/>
    <text x="24" y="34" font-family="system-ui" font-weight="600" font-size="11" fill="#748FFC">SECURITY VERIFIED</text>
    <text x="24" y="62" font-family="'Syne', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">Face ID &amp; MPC</text>
    <text x="24" y="86" font-family="system-ui" font-weight="400" font-size="11" fill="#8C8C8C">Zero-knowledge proof encryption</text>
    <circle cx="210" cy="40" r="12" fill="#3B5BDB"/>
  </g>
</svg>
